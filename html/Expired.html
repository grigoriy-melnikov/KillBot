<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Уведомление</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
        }

        .container {
            text-align: center;
            padding: 20px;
            background-color: #fff;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);
            border-radius: 10px;
            max-width: 400px;
            width: 90%;
        }

        .container p {
            font-size: 18px;
            color: #333;
            margin-bottom: 20px;
        }

        .btn-reload {
            background-color: #007BFF;
            color: #fff;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            cursor: pointer;
            border-radius: 5px;
            width: 100%;
        }

        .btn-reload:hover {
            background-color: #0056b3;
        }

        @media (max-width: 768px) {
            .container p {
                font-size: 16px;
            }

            .btn-reload {
                font-size: 14px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <p>Пришло время оплачивать KillBot. Перейдите на https://killbot.ru и продлите подписку защиты от поведенческих ботов и DDoS KillBot.</p>
        <button class="btn-reload" onclick="location.reload()">Войти на сайт.</button>
    </div>

</body>
</html>
